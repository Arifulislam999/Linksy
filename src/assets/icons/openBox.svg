<svg
        width="200"
        height="200"
        viewBox="0 0 200 200"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        {/* Comment Bubble */}
        <path
          d="M50 70C50 55.67 62.67 45 80 45H120C137.33 45 150 55.67 150 70V100C150 114.33 137.33 125 120 125H90L65 145V125H80C62.67 125 50 114.33 50 100V70Z"
          fill="none"
          stroke="#FFFFFF"
          strokeWidth="10"
          strokeLinecap="round"
          strokeLinejoin="round"
        />

        {/* Dots Animation */}
        <circle cx="80" cy="85" r="5" fill="#888">
          <animate
            attributeName="opacity"
            values="0;1;0"
            dur="1.5s"
            repeatCount="indefinite"
          />
        </circle>
        <circle cx="100" cy="85" r="5" fill="#888">
          <animate
            attributeName="opacity"
            values="0;1;0"
            dur="1.5s"
            begin="0.3s"
            repeatCount="indefinite"
          />
        </circle>
        <circle cx="120" cy="85" r="5" fill="#888">
          <animate
            attributeName="opacity"
            values="0;1;0"
            dur="1.5s"
            begin="0.6s"
            repeatCount="indefinite"
          />
        </circle>
      </svg>